<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RockyDelish - Sign Up</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="signup-page">

        <!-- LEFT SIDE -->
        <div class="signup-design">

            <div class="design-content">

                <h1>Rocky<span>Delish</span></h1>

                <h2>Delicious food,<br>
                    delivered to you.</h2>

                <p>
                    Create an account and enjoy your
                    favourite meals from the comfort of your home.
                </p>

                <div class="food-decoration">
                    <i class="fa-solid fa-burger"></i>
                    <i class="fa-solid fa-pizza-slice"></i>
                    <i class="fa-solid fa-utensils"></i>
                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="signup-section">

            <!-- HEADER -->
            <div class="auth-header">

                <button class="back-btn" onclick="goBack()">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <h2>New Account</h2>

            </div>


            <!-- FORM AREA -->
            <div class="signup-container">

                <div class="welcome-text">

                    <h3>Create your account</h3>

                    <p>
                        Sign up to start ordering delicious food.
                    </p>

                </div>


                <!-- SIGN UP FORM -->
                <form id="signupForm">

                    <!-- FULL NAME -->
                    <div class="input-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-user"></i>

                            <input
                                type="text"
                                id="fullName"
                                placeholder="Enter your full name"
                                required>

                        </div>

                    </div>


                    <!-- EMAIL -->
                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required>

                        </div>

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                minlength="6"
                                required>

                            <i
                                class="fa-solid fa-eye password-eye"
                                id="eyeIcon"
                                onclick="togglePassword()">
                            </i>

                        </div>

                    </div>


                    <!-- MOBILE NUMBER -->
                    <div class="input-group">

                        <label for="mobileNumber">
                            Mobile Number
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-phone"></i>

                            <input
                                type="tel"
                                id="mobileNumber"
                                placeholder="Enter your mobile number"
                                required>

                        </div>

                    </div>


                    <!-- DATE OF BIRTH -->
                    <div class="input-group">

                        <label for="dateOfBirth">
                            Date of Birth
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-calendar"></i>

                            <input
                                type="date"
                                id="dateOfBirth"
                                required>

                        </div>

                    </div>


                    <!-- TERMS -->
                    <div class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required>

                        <label for="terms">
                            I agree to the Terms and Conditions
                        </label>

                    </div>


                    <!-- SIGN UP -->
                    <button
                        type="submit"
                        class="signup-btn">

                        Sign Up

                    </button>

                </form>


                <!-- DIVIDER -->
                <div class="divider">

                    <span>OR</span>

                </div>


                <!-- GOOGLE -->
                <button
                    type="button"
                    class="social-btn"
                    id="googleSignupBtn">

                    <i class="fa-brands fa-google"></i>

                    Continue with Google

                </button>


                <!-- FACEBOOK -->
                


                <!-- LOGIN -->
                <p class="login-text">

                    Already have an account?

                    <a href="login.html">
                        Log in
                    </a>

                </p>

            </div>

        </div>

    </div>


    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Firebase / Signup JS -->
    <script
        type="module"
        src="signup.js">
    </script>
</body>

</html>

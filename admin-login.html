<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | RockyDelish</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >


    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
    ></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family: "Poppins", sans-serif;

            background: #071426;

        }


        .admin-login {

            width: 100%;

            max-width: 430px;

            background: white;

            border-radius: 18px;

            padding: 40px 30px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.25);

        }


        .logo {

            text-align: center;

            margin-bottom: 10px;

            font-size: 30px;

            font-weight: 700;

            color: #071426;

        }


        .logo span {

            color: #fc8a06;

        }


        .admin-icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #fff2e4;

            color: #fc8a06;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

        }


        .heading {

            text-align: center;

            margin-bottom: 30px;

        }


        .heading h1 {

            font-size: 23px;

            margin-bottom: 7px;

            color: #071426;

        }


        .heading p {

            color: #777;

            font-size: 14px;

        }


        .google-btn {

            width: 100%;

            height: 50px;

            border: 1px solid #ddd;

            border-radius: 10px;

            background: white;

            cursor: pointer;

            font-family: inherit;

            font-size: 15px;

            font-weight: 500;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            transition: 0.3s;

        }


        .google-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.08);

        }


        .google-btn i {

            color: #4285f4;

            font-size: 18px;

        }


        .back-home {

            display: block;

            text-align: center;

            margin-top: 25px;

            color: #777;

            text-decoration: none;

            font-size: 14px;

        }


        .back-home:hover {

            color: #fc8a06;

        }

    </style>
</head>


<body>


    <div class="admin-login">


        <div class="admin-icon">

            <i class="fa-solid fa-user-shield"></i>

        </div>


        <div class="logo">

            Rocky<span>Delish</span>

        </div>


        <div class="heading">

            <h1>Admin Login</h1>

            <p>
                Sign in to manage customer orders.
            </p>

        </div>


        <button
            type="button"
            class="google-btn"
            id="adminGoogleBtn"
        >

            <i class="fa-brands fa-google"></i>

            Continue with Google

        </button>


        <a
            href="index.html"
            class="back-home"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back to RockyDelish

        </a>


    </div>


    <script
        type="module"
        src="admin-login.js"
    ></script>
</body>

</html>

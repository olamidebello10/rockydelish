<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Orders | RockyDelish</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f7f7f7;
            color: #071426;
        }

        .navbar {
            height: 80px;
            background: #071426;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: #fc8a06;
        }

        .admin-title {
            color: white;
            font-size: 16px;
        }

        .page {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }

        .page-heading {
            margin-bottom: 30px;
        }

        .page-heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-heading h1 span {
            color: #fc8a06;
        }

        .page-heading p {
            color: #777;
        }

        .orders-container {
            display: grid;
            gap: 25px;
        }

        .admin-order {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .order-top h2 {
            font-size: 19px;
        }

        .order-top p {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .customer-info {
            margin-bottom: 20px;
        }

        .customer-info h3 {
            font-size: 17px;
            margin-bottom: 12px;
        }

        .customer-info p {
            margin-bottom: 7px;
            font-size: 14px;
            color: #555;
        }

        .status-box {
            background: #f8f8f8;
            padding: 18px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .status-box label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .status-select {
            width: 100%;
            height: 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 0 12px;
            font-family: inherit;
            font-size: 14px;
            background: white;
        }

        .update-btn {
            margin-top: 12px;
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            background: #fc8a06;
            color: white;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #e97900;
        }

        .items {
            margin-top: 20px;
        }

        .items h3 {
            font-size: 17px;
            margin-bottom: 12px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-weight: 700;
            font-size: 17px;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
        }

        @media (max-width: 650px) {

            .navbar {
                padding: 0 5%;
            }

            .admin-title {
                display: none;
            }

            .page {
                width: 92%;
                margin-top: 30px;
            }

            .order-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="logo">
            Rocky<span>Delish</span>
        </a>

        <div class="admin-title">
            <i class="fa-solid fa-gear"></i>
            Manage Orders
        </div>

    </nav>


    <main class="page">

        <div class="page-heading">

            <h1>
                Manage <span>Orders</span>
            </h1>

            <p>
                View customer orders and update their delivery status.
            </p>

        </div>


        <div
            class="orders-container"
            id="ordersContainer"
        ></div>

    </main>


    <script type="module" src="admin-orders.js"></script>
</body>
</html>
